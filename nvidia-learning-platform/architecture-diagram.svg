<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients and styles -->
  <defs>
    <!-- Green gradient for NVIDIA theme -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76b900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1" />
    </linearGradient>

    <!-- Blue gradient for frontend -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>

    <!-- Purple gradient for backend -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#4ade80" />
    </marker>

    <!-- Bidirectional arrow -->
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto">
      <polygon points="10,0 0,5 10,10" fill="#4ade80" />
    </marker>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0a0a0a"/>

  <!-- Grid pattern for technical look -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="800" fill="url(#grid)" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#4ade80" text-anchor="middle">
    NVIDIA Learning Platform - System Architecture
  </text>

  <!-- Layer 1: Client Layer -->
  <g id="client-layer">
    <rect x="50" y="80" width="1100" height="120" rx="10" fill="#0f0f0f" stroke="#4ade80" stroke-width="2" opacity="0.8"/>
    <text x="70" y="110" font-family="monospace" font-size="16" font-weight="bold" fill="#4ade80">CLIENT LAYER</text>

    <!-- User devices -->
    <rect x="150" y="120" width="180" height="60" rx="5" fill="url(#blueGradient)" filter="url(#shadow)"/>
    <text x="240" y="155" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Web Browser</text>
    <text x="240" y="170" font-family="monospace" font-size="11" fill="white" text-anchor="middle">React 18 / Next.js</text>

    <rect x="360" y="120" width="180" height="60" rx="5" fill="url(#blueGradient)" filter="url(#shadow)"/>
    <text x="450" y="155" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Mobile App</text>
    <text x="450" y="170" font-family="monospace" font-size="11" fill="white" text-anchor="middle">React Native (Future)</text>

    <rect x="570" y="120" width="180" height="60" rx="5" fill="url(#blueGradient)" filter="url(#shadow)"/>
    <text x="660" y="155" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Desktop App</text>
    <text x="660" y="170" font-family="monospace" font-size="11" fill="white" text-anchor="middle">Electron (Future)</text>
  </g>

  <!-- Layer 2: Presentation Layer -->
  <g id="presentation-layer">
    <rect x="50" y="220" width="1100" height="140" rx="10" fill="#0f0f0f" stroke="#4ade80" stroke-width="2" opacity="0.8"/>
    <text x="70" y="250" font-family="monospace" font-size="16" font-weight="bold" fill="#4ade80">PRESENTATION LAYER</text>

    <!-- Frontend Applications -->
    <rect x="150" y="270" width="220" height="70" rx="5" fill="url(#greenGradient)" filter="url(#shadow)"/>
    <text x="260" y="295" font-family="Arial" font-size="14" fill="black" text-anchor="middle" font-weight="bold">Pathway Visualizer</text>
    <text x="260" y="310" font-family="monospace" font-size="11" fill="black" text-anchor="middle">• D3.js Force Graph</text>
    <text x="260" y="325" font-family="monospace" font-size="11" fill="black" text-anchor="middle">• React Components</text>

    <rect x="400" y="270" width="220" height="70" rx="5" fill="url(#greenGradient)" filter="url(#shadow)"/>
    <text x="510" y="295" font-family="Arial" font-size="14" fill="black" text-anchor="middle" font-weight="bold">AI Chat Assistant</text>
    <text x="510" y="310" font-family="monospace" font-size="11" fill="black" text-anchor="middle">• Next.js App Router</text>
    <text x="510" y="325" font-family="monospace" font-size="11" fill="black" text-anchor="middle">• React Markdown</text>

    <rect x="650" y="270" width="220" height="70" rx="5" fill="url(#greenGradient)" filter="url(#shadow)"/>
    <text x="760" y="295" font-family="Arial" font-size="14" fill="black" text-anchor="middle" font-weight="bold">Admin Dashboard</text>
    <text x="760" y="310" font-family="monospace" font-size="11" fill="black" text-anchor="middle">• Analytics Views</text>
    <text x="760" y="325" font-family="monospace" font-size="11" fill="black" text-anchor="middle">• User Management</text>

    <!-- State Management -->
    <rect x="900" y="270" width="220" height="70" rx="5" fill="#1f2937" stroke="#4ade80" stroke-width="1" filter="url(#shadow)"/>
    <text x="1010" y="295" font-family="Arial" font-size="14" fill="#4ade80" text-anchor="middle" font-weight="bold">State Management</text>
    <text x="1010" y="310" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">• Zustand Store</text>
    <text x="1010" y="325" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">• React Query Cache</text>
  </g>

  <!-- Layer 3: API Gateway Layer -->
  <g id="api-layer">
    <rect x="50" y="380" width="1100" height="100" rx="10" fill="#0f0f0f" stroke="#4ade80" stroke-width="2" opacity="0.8"/>
    <text x="70" y="410" font-family="monospace" font-size="16" font-weight="bold" fill="#4ade80">API GATEWAY LAYER</text>

    <rect x="300" y="415" width="600" height="50" rx="5" fill="#1f2937" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
    <text x="600" y="435" font-family="Arial" font-size="14" fill="#4ade80" text-anchor="middle" font-weight="bold">REST API Gateway</text>
    <text x="600" y="455" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">Authentication | Rate Limiting | Load Balancing | Request Routing</text>
  </g>

  <!-- Layer 4: Business Logic Layer -->
  <g id="business-layer">
    <rect x="50" y="500" width="1100" height="140" rx="10" fill="#0f0f0f" stroke="#4ade80" stroke-width="2" opacity="0.8"/>
    <text x="70" y="530" font-family="monospace" font-size="16" font-weight="bold" fill="#4ade80">BUSINESS LOGIC LAYER</text>

    <!-- Microservices -->
    <rect x="120" y="550" width="180" height="70" rx="5" fill="url(#purpleGradient)" filter="url(#shadow)"/>
    <text x="210" y="575" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Course Service</text>
    <text x="210" y="590" font-family="monospace" font-size="10" fill="white" text-anchor="middle">• CRUD Operations</text>
    <text x="210" y="605" font-family="monospace" font-size="10" fill="white" text-anchor="middle">• Prerequisite Logic</text>

    <rect x="320" y="550" width="180" height="70" rx="5" fill="url(#purpleGradient)" filter="url(#shadow)"/>
    <text x="410" y="575" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">User Service</text>
    <text x="410" y="590" font-family="monospace" font-size="10" fill="white" text-anchor="middle">• Authentication</text>
    <text x="410" y="605" font-family="monospace" font-size="10" fill="white" text-anchor="middle">• Profile Management</text>

    <rect x="520" y="550" width="180" height="70" rx="5" fill="url(#purpleGradient)" filter="url(#shadow)"/>
    <text x="610" y="575" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Progress Service</text>
    <text x="610" y="590" font-family="monospace" font-size="10" fill="white" text-anchor="middle">• Track Completion</text>
    <text x="610" y="605" font-family="monospace" font-size="10" fill="white" text-anchor="middle">• Analytics</text>

    <rect x="720" y="550" width="180" height="70" rx="5" fill="url(#purpleGradient)" filter="url(#shadow)"/>
    <text x="810" y="575" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">AI Service</text>
    <text x="810" y="590" font-family="monospace" font-size="10" fill="white" text-anchor="middle">• LangChain</text>
    <text x="810" y="605" font-family="monospace" font-size="10" fill="white" text-anchor="middle">• Recommendations</text>

    <rect x="920" y="550" width="180" height="70" rx="5" fill="url(#purpleGradient)" filter="url(#shadow)"/>
    <text x="1010" y="575" font-family="Arial" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Path Service</text>
    <text x="1010" y="590" font-family="monospace" font-size="10" fill="white" text-anchor="middle">• Path Generation</text>
    <text x="1010" y="605" font-family="monospace" font-size="10" fill="white" text-anchor="middle">• Optimization</text>
  </g>

  <!-- Layer 5: Data Layer -->
  <g id="data-layer">
    <rect x="50" y="660" width="1100" height="120" rx="10" fill="#0f0f0f" stroke="#4ade80" stroke-width="2" opacity="0.8"/>
    <text x="70" y="690" font-family="monospace" font-size="16" font-weight="bold" fill="#4ade80">DATA PERSISTENCE LAYER</text>

    <!-- Databases -->
    <rect x="150" y="710" width="200" height="50" rx="5" fill="#065f46" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="250" y="730" font-family="Arial" font-size="14" fill="#10b981" text-anchor="middle" font-weight="bold">PostgreSQL</text>
    <text x="250" y="745" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle">Primary Database</text>

    <rect x="380" y="710" width="200" height="50" rx="5" fill="#7c2d12" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
    <text x="480" y="730" font-family="Arial" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="bold">Redis</text>
    <text x="480" y="745" font-family="monospace" font-size="11" fill="#ea580c" text-anchor="middle">Cache & Sessions</text>

    <rect x="610" y="710" width="200" height="50" rx="5" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="710" y="730" font-family="Arial" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="bold">Vector DB</text>
    <text x="710" y="745" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle">Embeddings (Pinecone)</text>

    <rect x="840" y="710" width="200" height="50" rx="5" fill="#4c1d95" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <text x="940" y="730" font-family="Arial" font-size="14" fill="#8b5cf6" text-anchor="middle" font-weight="bold">S3 Storage</text>
    <text x="940" y="745" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="middle">Files & Media</text>
  </g>

  <!-- External Services -->
  <g id="external-services">
    <rect x="900" y="80" width="230" height="120" rx="10" fill="#0f0f0f" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
    <text x="920" y="110" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b">EXTERNAL SERVICES</text>

    <rect x="920" y="125" width="190" height="25" rx="3" fill="#422006" stroke="#f59e0b" stroke-width="1"/>
    <text x="1015" y="142" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle">OpenAI GPT-4 API</text>

    <rect x="920" y="160" width="190" height="25" rx="3" fill="#422006" stroke="#f59e0b" stroke-width="1"/>
    <text x="1015" y="177" font-family="monospace" font-size="11" fill="#f59e0b" text-anchor="middle">Auth0 / OAuth2</text>
  </g>

  <!-- Data Flow Arrows -->
  <!-- Client to Presentation -->
  <line x1="450" y1="190" x2="450" y2="265" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)" marker-start="url(#arrowhead2)"/>

  <!-- Presentation to API Gateway -->
  <line x1="400" y1="345" x2="400" y2="410" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="345" x2="510" y2="410" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="760" y1="345" x2="760" y2="410" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- API Gateway to Business Logic -->
  <line x1="600" y1="470" x2="210" y2="545" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="470" x2="410" y2="545" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="470" x2="610" y2="545" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="470" x2="810" y2="545" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="470" x2="1010" y2="545" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Business Logic to Data Layer -->
  <line x1="210" y1="625" x2="250" y2="705" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="625" x2="250" y2="705" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="610" y1="625" x2="250" y2="705" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="810" y1="625" x2="710" y2="705" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- AI Service to External -->
  <line x1="810" y1="550" x2="915" y2="145" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <!-- WebSocket connection indicator -->
  <g id="websocket">
    <line x1="100" y1="200" x2="100" y2="640" stroke="#10b981" stroke-width="3" stroke-dasharray="10,5" opacity="0.5"/>
    <text x="110" y="420" font-family="monospace" font-size="12" fill="#10b981" transform="rotate(-90 110 420)">WebSocket (Real-time)</text>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(50, 720)">
    <text x="0" y="-10" font-family="Arial" font-size="12" font-weight="bold" fill="#4ade80">Legend:</text>
    <line x1="0" y1="0" x2="30" y2="0" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="35" y="5" font-family="Arial" font-size="11" fill="#888">Data Flow</text>

    <line x1="120" y1="0" x2="150" y2="0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="155" y="5" font-family="Arial" font-size="11" fill="#888">External API</text>

    <line x1="250" y1="0" x2="280" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="10,5"/>
    <text x="285" y="5" font-family="Arial" font-size="11" fill="#888">WebSocket</text>
  </g>

  <!-- Performance Metrics -->
  <g id="metrics" transform="translate(900, 700)">
    <rect x="0" y="0" width="250" height="80" rx="5" fill="#0f0f0f" stroke="#4ade80" stroke-width="1"/>
    <text x="10" y="20" font-family="monospace" font-size="12" font-weight="bold" fill="#4ade80">Performance Targets:</text>
    <text x="10" y="40" font-family="monospace" font-size="10" fill="#888">• API Response: &lt;500ms</text>
    <text x="10" y="55" font-family="monospace" font-size="10" fill="#888">• Page Load: &lt;2s</text>
    <text x="10" y="70" font-family="monospace" font-size="10" fill="#888">• Concurrent Users: 10K+</text>
  </g>
</svg>