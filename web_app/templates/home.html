<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVIDIA Course Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/widget.css">
</head>
<body>
    <!-- Floating Chat Widget Toggle Button -->
    <button id="chat-widget-toggle" class="chat-widget-toggle" onclick="toggleChatWidget()" aria-label="Open chat assistant">
        <i class="fas fa-robot"></i>
        <span class="widget-badge" id="widget-badge" style="display: none;">1</span>
    </button>

    <!-- Floating Chat Widget Container -->
    <div id="chat-widget-container" class="chat-widget-container" style="display: none;">
        <!-- Resize Handle (Top-Left Corner) -->
        <div class="widget-resize-handle" id="widget-resize-handle" title="Drag to resize">
            <i class="fas fa-expand-arrows-alt"></i>
        </div>

        <!-- Widget Header -->
        <div class="chat-widget-header">
            <div class="widget-header-content">
                <i class="fas fa-robot"></i>
                <span>NvidiAdvisor</span>
                <span class="status-dot"></span>
            </div>
            <button class="widget-close-btn" onclick="closeChatWidget()" aria-label="Close chat">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Chat Interface (from existing chatbot) -->
        <div id="chat-messages" class="widget-chat-messages">
            <!-- Welcome message -->
            <div class="message bot hero">
                <strong><i class="fas fa-robot"></i> NvidiAdvisor:</strong>
                <p>Hello! I can help you navigate NVIDIA's course catalog. You can ask me:</p>
                <ul>
                    <li>What prerequisites do I need for [course]?</li>
                    <li>Which courses teach [topic]?</li>
                    <li>What's a good starting point for beginners?</li>
                    <li>How long does [course] take?</li>
                </ul>
            </div>
        </div>

        <!-- Thought Process Indicator -->
        <div id="thought-process-container" class="thought-process-container" style="display: none;">
            <div class="thought-process-content">
                <i class="fas fa-brain fa-pulse thought-process-icon"></i>
                <span id="thought-process-text">Processing...</span>
                <div class="step-dots">
                    <span class="dot" id="dot-1"></span>
                    <span class="dot" id="dot-2"></span>
                    <span class="dot" id="dot-3"></span>
                    <span class="dot" id="dot-4"></span>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="widget-input-area">
            <div class="input-container">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask about courses..."
                    maxlength="500"
                >
                <button onclick="sendMessage()" id="send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="input-footer">
                <span id="char-counter">0/500</span>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
    <script src="/static/widget.js"></script>
</body>
</html>
